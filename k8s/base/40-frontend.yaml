apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels: {app: frontend}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: demo-app:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "frontend.py"]
          ports:
            - containerPort: 8080
          env:
            - {name: PORT, value: "8080"}
            - {name: ORDERS_URL, value: "http://orders:5000"}
            - {name: ORDERS_TIMEOUT, value: "2"}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  selector: {app: frontend}
  ports:
    - port: 8080
      targetPort: 8080
