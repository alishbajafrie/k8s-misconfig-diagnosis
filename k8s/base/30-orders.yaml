apiVersion: v1
kind: Secret
metadata:
  name: orders-db
  namespace: demo
type: Opaque
stringData:
  DB_PASSWORD: shop-pass-123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: demo
  labels: {app: orders}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: demo-app:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "orders.py"]
          ports:
            - containerPort: 5000
          env:
            - {name: PORT, value: "5000"}
            - {name: DB_HOST, value: postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: shop}
            - {name: DB_USER, value: shop}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orders-db, key: DB_PASSWORD}
            - {name: REDIS_HOST, value: redis}
            - {name: REDIS_PORT, value: "6379"}
          readinessProbe:
            httpGet: {path: /ready, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: demo
spec:
  selector: {app: orders}
  ports:
    - port: 5000
      targetPort: 5000
